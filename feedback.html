<html lang="zh-Hant-TW" data-page-type="feedback" data-content-group="回饋">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>推薦好書與意見回饋｜折角 Dogeared</title>
  <meta name="description" content="想推薦一本書、對折角 Dogeared 有任何意見，或發現心得內容有誤，都可以在這裡留言。送出的內容只有站長看得到，不會公開；有填 Email 才會收到回覆。">
  <meta property="og:title" content="推薦好書與意見回饋｜折角 Dogeared">
  <meta property="og:description" content="想推薦一本書、對折角 Dogeared 有任何意見，或發現心得內容有誤，都可以在這裡留言。送出的內容只有站長看得到，不會公開；有填 Email 才會收到回覆。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://drew-chen-yc.github.io/book-notes/feedback.html">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="https://drew-chen-yc.github.io/book-notes/feedback.html">
  <!-- 追蹤程式必須最先載入：Consent 預設值 → dataLayer 脈絡 → GTM -->
  <script src="assets/analytics.js"></script>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <meta property="og:image" content="https://drew-chen-yc.github.io/book-notes/assets/og.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="assets/style.css?v=20261004a">
</head>
<body>
  <header class="site-header"><div class="wrap">
    <a class="logo" href="index.html">折角<span>Dogeared</span><small>｜讀書心得與推薦</small></a>
    <nav><a href="reviews.html">心得</a><a href="lists.html">書單</a><a href="books.html">全部的書</a><a href="about.html">關於</a></nav>
  </div></header>
  <main class="wrap narrow listing">
    <nav class="crumb"><a href="index.html">首頁</a> / 回饋</nav>
    <h1>推薦好書與意見回饋</h1>
    <form id="feedback" class="fb" novalidate>
      <fieldset class="fb-types">
        <legend>想說什麼？</legend>
        <label><input type="radio" name="type" value="推薦好書" checked><span>推薦一本書</span></label>
        <label><input type="radio" name="type" value="網站意見"><span>給網站的意見</span></label>
        <label><input type="radio" name="type" value="內容更正"><span>心得內容有誤</span></label>
      </fieldset>
      <div class="fb-row" data-for="推薦好書">
        <div><label for="fb-book">書名</label><input id="fb-book" name="book" type="text" maxlength="80" autocomplete="off"></div>
        <div><label for="fb-author">作者<small>選填</small></label><input id="fb-author" name="author" type="text" maxlength="60" autocomplete="off"></div>
      </div>
      <div><label for="fb-msg" id="fb-msg-label">為什麼推薦</label><textarea id="fb-msg" name="message" rows="6" maxlength="1000" required></textarea><p class="fb-count"><span id="fb-n">0</span> / 1000</p></div>
      <div class="fb-row">
        <div><label for="fb-name">稱呼<small>選填</small></label><input id="fb-name" name="name" type="text" maxlength="30" autocomplete="nickname"></div>
        <div><label for="fb-email">Email<small>選填，想收到回覆再填</small></label><input id="fb-email" name="email" type="email" maxlength="254" autocomplete="email"></div>
      </div>
      <p class="form-note">送出的內容只有站長看得到，不會公開。若有填 Email，只用來回覆這則留言。詳見<a href="about.html#privacy">隱私說明</a>。</p>
      <p><button class="btn btn-dark" type="submit">送出</button></p>
      <p class="form-msg" aria-live="polite"></p>
    </form>
  </main>
  <footer class="site-footer"><div class="wrap">
    <form id="newsletter" novalidate>
      <h2>每月一封新心得</h2>
      <p>不寄廣告，只寄這個月讀完的書。</p>
      <div class="form-row">
        <label class="sr-only" for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        <label class="sr-only" for="interest">感興趣的分類</label>
        <select id="interest" name="interest">
          <option value="all">全部分類</option><option value="自我成長">自我成長</option><option value="心理學">心理學</option><option value="歷史">歷史</option><option value="投資理財">投資理財</option>
        </select>
        <button class="btn" type="submit">訂閱</button>
      </div>
      <p class="form-msg" aria-live="polite"></p>
    </form>
    <p class="copyright">© 2026 折角 Dogeared · <a href="about.html#privacy">隱私說明</a></p>
  </div></footer>
  <script src="data/reviews.js"></script>
  <script src="assets/app.js?v=20261004a"></script>
</body>
</html>
